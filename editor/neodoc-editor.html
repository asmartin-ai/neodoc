<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neodoc editor</title>
<style>
/* Editor chrome only.
   Styles for the document itself come from the document's own canonical
   <style> block (docs/SPEC.md §6), which is inserted into <head> ahead of this
   file, so nothing here restyles document content except the editing affordances.
   This file is never written to the saved document. */

#chrome { position: fixed; inset: 0; pointer-events: none; z-index: 10; font: 13px system-ui, sans-serif; color: #111; }
#chrome button, #chrome input, #chrome label { pointer-events: auto; }

/* Document content must not hide under the fixed toolbars. */
@media screen {
  body { padding-top: 3.4rem; padding-bottom: 2.6rem; padding-right: 17rem; }
  @media (max-width: 60rem) { body { padding-right: 1rem; } }
}

/* ---- toolbar ---- */
#toolbar {
  position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap;
  gap: 2px; align-items: center; padding: 4px 6px; background: #f6f6f7;
  border-bottom: 1px solid #d8d8da; pointer-events: auto;
}
#toolbar button {
  font: inherit; padding: 3px 7px; border: 1px solid #c9c9cd; border-radius: 4px;
  background: #fff; cursor: pointer;
}
#toolbar button:hover { background: #ececef; }
#toolbar button[aria-pressed="true"] { background: #d7e7ff; border-color: #7aa7e0; }
#toolbar .sep { width: 1px; height: 18px; background: #cfcfd4; margin: 0 4px; }
#toolbar .switch { display: inline-flex; gap: 4px; align-items: center; margin-left: 4px; }

/* ---- comment sidebar ---- */
#sidebar {
  position: absolute; top: 3.4rem; right: 0; bottom: 2.6rem; width: 16rem; overflow: auto;
  background: #fbfbfc; border-left: 1px solid #d8d8da; padding: 8px 10px;
  pointer-events: auto; font-size: 12px;
}
#sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; margin: 0 0 6px; }
#sidebar ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
#sidebar li { border: 1px solid #dcdce0; border-radius: 4px; padding: 6px; background: #fff; }
#sidebar li b { display: block; color: #333; }
#sidebar li p { margin: 4px 0; }
#sidebar li blockquote { margin: 4px 0; padding-left: 6px; border-left: 2px solid #dcdce0; color: #666; }
#sidebar button { font: inherit; font-size: 11px; margin-right: 4px; padding: 2px 6px; cursor: pointer; }
#sidebar li[data-resolved] { opacity: .6; }

/* ---- status bar ---- */
#statusbar {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
  padding: 4px 8px; background: #f6f6f7; border-top: 1px solid #d8d8da;
  pointer-events: auto; font-size: 12px; overflow: hidden;
}
#statusbar > span { white-space: nowrap; }
#statusbar #st-state { color: #444; }
#statusbar #st-dirty[data-dirty="true"] { color: #a2450b; font-weight: 600; }
#statusbar #st-sel { color: #444; font-family: ui-monospace, monospace; }
#statusbar #st-cli {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: #555; font-family: ui-monospace, monospace;
}
#statusbar button { font: inherit; padding: 1px 6px; cursor: pointer; }

/* ---- editing affordances (document content, editor-only) ---- */
body:focus { outline: none; }
/* An empty block has no height of its own; give the caret somewhere to sit.
   This is CSS only — no placeholder character is ever written to the DOM. */
p:empty, h1:empty, h2:empty, h3:empty, h4:empty, h5:empty, h6:empty, li:empty {
  min-height: 1.2em;
}
</style>
</head>
<body contenteditable="true" spellcheck="false">
<p></p>
<div id="chrome" contenteditable="false">
  <!--
    The body IS the document: its children are the document's blocks and are what
    src/format.js canonicalizes on save. #chrome is the only editor-owned element
    in here and is detached while format() runs; every comment inside it is safe
    because this element never reaches the file. Comments anywhere else in this
    page do: the HTML parser moves them into the body, where format() keeps them.
  -->
  <div id="toolbar" role="toolbar" aria-label="Document commands">
    <button type="button" data-cmd="open" aria-label="Open file">Open</button>
    <button type="button" data-cmd="save" aria-label="Save file">Save</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="strong" aria-label="Bold">B</button>
    <button type="button" data-cmd="em" aria-label="Italic">I</button>
    <button type="button" data-cmd="u" aria-label="Underline">U</button>
    <button type="button" data-cmd="s" aria-label="Strikethrough">S</button>
    <button type="button" data-cmd="code" aria-label="Inline code">&lt;&gt;</button>
    <button type="button" data-cmd="mark" aria-label="Highlight">==</button>
    <button type="button" data-cmd="a" aria-label="Link">Link</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="h1" aria-label="Heading 1">H1</button>
    <button type="button" data-cmd="h2" aria-label="Heading 2">H2</button>
    <button type="button" data-cmd="h3" aria-label="Heading 3">H3</button>
    <button type="button" data-cmd="ul" aria-label="Bullet list">UL</button>
    <button type="button" data-cmd="ol" aria-label="Numbered list">OL</button>
    <button type="button" data-cmd="blockquote" aria-label="Block quote">Quote</button>
    <button type="button" data-cmd="pre" aria-label="Code block">Code</button>
    <button type="button" data-cmd="hr" aria-label="Horizontal rule">Rule</button>
    <button type="button" data-cmd="img" aria-label="Insert image">Image</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="comment" aria-label="Comment on selection">Comment</button>
    <button type="button" data-cmd="suggest" aria-label="Suggest changes" aria-pressed="false">Suggest</button>
    <button type="button" data-cmd="accept" aria-label="Accept changes in block">Accept</button>
    <button type="button" data-cmd="reject" aria-label="Reject changes in block">Reject</button>
    <span class="sep" aria-hidden="true"></span>
    <label class="switch"><input type="checkbox" id="embed" checked> embed images</label>
  </div>

  <aside id="sidebar" aria-label="Comment threads">
    <h2>Comments</h2>
    <p id="no-comments">No comments.</p>
    <ol id="threads"></ol>
  </aside>

  <div id="statusbar">
    <span id="st-dirty" data-dirty="false">saved</span>
    <span id="st-state">no file open</span>
    <span id="st-blocks">0 blocks</span>
    <span id="st-sel">body</span>
    <span id="st-comments">0 comments</span>
    <button type="button" data-cmd="copy-cli" aria-label="Copy the neodoc command">Copy CLI</button>
    <code id="st-cli"></code>
  </div>

  <input id="open-input" type="file" accept=".nd.html,.ndoc.html,.ndoc,.html,.htm,text/html" hidden aria-label="Open a Neodoc file">
  <input id="image-input" type="file" accept="image/*" hidden aria-label="Insert an image">
</div>

  return `${fence}${lang}\n${body}\n${fence}`;
}

function listMd(node, ctx) {
  const ordered = node.name === 'ol';
  const out = [];
  let n = 1;
  for (const li of kidsOf(node).filter((c) => isEl(c, 'li'))) {
    // `- [x]` is the only form markdown has for an item, and `data-checked` the only
    // attribute it can carry.
    if (!onlyAttrs(li, LI_ATTRS)) return rawHtml(node);
    const checked = attrsOf(li)['data-checked'];
    const box = checked === undefined ? '' : checked === 'true' ? '[x] ' : '[ ] ';
    const marker = `${ordered ? `${n++}. ` : '- '}${box}`;
    const pad = ' '.repeat(marker.length);
    const groups = groupBlocks(kidsOf(li));
    const lines = itemMd(ctx, groups).split('\n');
    if (groups[0] && groups[0].kind === 'para') out.push(marker + lines.shift());
    else out.push(marker.trimEnd());
    for (const l of lines) out.push(l === '' ? '' : pad + l);
  }
  return out.join('\n');
}

function itemMd(ctx, groups) {
  return groups.map((g) => (g.kind === 'para' ? paraMd(paraNodeMd(g.children, ctx)) : blockMd(g.node, ctx)))
    .filter((s) => s !== null && s !== '')
    .join('\n\n');
}

function quoteMd(md) {
  return md.split('\n').map((l) => (l === '' ? '>' : `> ${l}`)).join('\n');
}

function tableMd(node, ctx) {
  const thead = kidsOf(node).find((c) => isEl(c, 'thead'));
  const tbody = kidsOf(node).find((c) => isEl(c, 'tbody'));
  const headRows = thead ? kidsOf(thead).filter((c) => isEl(c, 'tr')) : [];
  const bodyRows = (tbody ? kidsOf(tbody) : kidsOf(node)).filter((c) => isEl(c, 'tr'));
  const all = [...headRows, ...bodyRows];
  // A pipe table is a header row plus a delimiter row plus body rows: anything
  // else (no `<thead>`, ragged rows, spanning cells) goes out as raw HTML.
  const cells = all.flatMap((r) => kidsOf(r));
  if (headRows.length !== 1 || cells.some((c) => attrsOf(c).colspan || attrsOf(c).rowspan || attrsOf(c).scope)) {
    return rawHtml(node);
  }
  // `data-align` becomes the delimiter row; any other attribute on the table, a row
  // or a cell has nowhere to go.
  if (!onlyAttrs(node, NO_ATTRS) || [...kidsOf(node), ...all].some((r) => !onlyAttrs(r, NO_ATTRS))
    || cells.some((c) => !onlyAttrs(c, CELL_ATTRS))) {
    return rawHtml(node);
  }
  const width = kidsOf(headRows[0]).length;
  if (all.some((r) => kidsOf(r).length !== width)) return rawHtml(node);
  // The delimiter row is one alignment per column, so a column is only expressible
  // when every cell in it says the same thing — a lone `data-align` on one cell would
  // come back on all of them.
  const column = (i) => all.map((r) => attrsOf(kidsOf(r)[i] || {})['data-align'] ?? null);
  const uniform = (i) => column(i).every((a) => a === column(i)[0]);
  const align = (i) => (uniform(i) ? column(i)[0] : null);
  if (Array.from({ length: width }, (_, i) => i).some((i) => !uniform(i))) return rawHtml(node);
  // A table cell is one line, so a break inside it must be the `<br>` form.
  const cellMd = (c) => {
    const prev = ctx.solidBr;
    ctx.solidBr = true;
    const md = inlineMd(kidsOf(c), ctx);
    ctx.solidBr = prev;
    return md;
  };
  const line = (r) => `| ${kidsOf(r).map((c) => escCell(cellMd(c))).join(' | ')} |`;
  const rule = Array.from({ length: width }, (_, i) => {
    const a = align(i);
    return a === 'center' ? ':--:' : a === 'right' ? '--:' : a === 'left' ? ':--' : '---';
  }).join(' | ');
  return [line(headRows[0]), `| ${rule} |`, ...bodyRows.map(line)].join('\n');
}

function figureMd(node, ctx) {
  const kids = kidsOf(node);
  const img = kids.find((c) => isEl(c, 'img'));
  const cap = kids.find((c) => isEl(c, 'figcaption'));
  // Layout whitespace is not a child to report; anything else the figure holds is.
  const extra = kids.some((c) => c !== img && c !== cap && !(c.type === 'text' && !c.text.trim()));
  // An attribute on the caption is as unexpressible as one on the figure, and
  // `![alt](src)` + caption can only read back in that order.
  const capBare = !!cap && onlyAttrs(cap, NO_ATTRS) && kids.indexOf(cap) > kids.indexOf(img);
  // A caption markdown cannot hold exactly — emphasised (it comes back as plain
  // text), carrying `*` or a line break (it would read as ordinary markdown), empty
  // — and a figure without one (`![…](…)` reads back as `<p><img></p>`) all go out
  // as raw HTML instead.
  const richCap = !!cap && kidsOf(cap).some((c) => c.type === 'element' && (c.name === 'em' || c.name === 'strong'));
  const capMd = cap ? inlineMd(kidsOf(cap), ctx) : '';
  const image = img ? imgMd(img) : '';
  if (!img || !cap || !capBare || !capMd || extra || richCap || /[*\n]/.test(capMd)
    || image.startsWith('<') || !onlyAttrs(node, NO_ATTRS)) return rawHtml(node);
  return `${image}\n\n*${capMd}*`;
}

function asideMd(node, ctx) {
  const note = attrsOf(node)['data-note'];
  if (note && NOTE_TO_ALERT[note] && onlyAttrs(node, NOTE_ATTRS)) {
    return quoteMd(`[!${NOTE_TO_ALERT[note]}]\n\n${sequenceMd(kidsOf(node), ctx)}`);
  }
  if (ctx.comments !== 'html') return null; // critic → anchored tail, drop → gone
  return rawHtml(node);
}

function blockMd(node, ctx) {
  if (node.type === 'text') return escMd(node.text);
  if (node.type === 'comment') return `<!--${node.text}-->`;
  const A = attrsOf(node);
  if (HEADINGS.has(node.name)) {
    if (hasAttrs(node)) return rawHtml(node);
    return `${'#'.repeat(+node.name[1])} ${inlineMd(kidsOf(node), ctx)}`;
  }
  switch (node.name) {
    case 'p': return hasAttrs(node) ? rawHtml(node) : paraMd(paraNodeMd(kidsOf(node), ctx));
    case 'ul':
    case 'ol': return hasAttrs(node) ? rawHtml(node) : listMd(node, ctx);
    case 'blockquote': return hasAttrs(node) ? rawHtml(node) : quoteMd(sequenceMd(kidsOf(node), ctx));
    case 'pre': return fenceMd(node);
    case 'hr': return hasAttrs(node) ? rawHtml(node) : '---';
    case 'table': return tableMd(node, ctx);
    case 'figure': return figureMd(node, ctx);
    case 'section': return hasAttrs(node) ? rawHtml(node) : sequenceMd(kidsOf(node), ctx);
    case 'aside': return asideMd(node, ctx);
    case 'img': return imgMd(node);
    default: return rawHtml(node);
  }
}

/** One markdown block per group, with critic comment threads right after their anchor. */
function sequenceMd(children, ctx) {
  const out = [];
  for (const g of groupBlocks(children)) {
    ctx.used = []; // comment anchors are collected per block
    const md = g.kind === 'para' ? paraMd(paraNodeMd(g.children, ctx)) : blockMd(g.node, ctx);
    if (md === null || md === '') continue;
    out.push(md + criticTail(ctx));
  }
  return out.join('\n\n');
}

function criticTail(ctx) {
  if (ctx.comments !== 'critic' || !ctx.used.length) return '';
  const lines = [];
  for (const id of new Set(ctx.used)) {
    const aside = ctx.threads.get(id);
    if (!aside || ctx.emitted.has(id)) continue;
    ctx.emitted.add(id);
    for (const p of kidsOf(aside).filter((c) => isEl(c, 'p'))) {
      const author = attrsOf(p)['data-author'];
      lines.push(`{>>${author ? `${author}: ` : ''}${inlineMd(kidsOf(p), ctx)}<<}`);
    }
  }
  return lines.length ? '\n\n' + lines.join('\n') : '';
}

function resolveBody(node) {
  if (!node) return { type: 'element', name: 'body', attrs: {}, children: [] };
  if (isEl(node, 'body')) return node;
  if (node.name === '#root' || isEl(node, 'html')) {
    const queue = [...(node.children || [])];
    while (queue.length) {
      const c = queue.shift();
      if (isEl(c, 'body')) return c;
      if (isEl(c, 'html')) queue.push(...(c.children || []));
    }
  }
  return node;
}

/**
 * GFM markdown for a body element.
 * `opts.comments`: `'html'` (default) | `'critic'` | `'drop'`.
 * Blocks are separated by a blank line; the text ends with one newline (`''` for
 * an empty body).
 */
function toMarkdown(bodyNode, opts = {}) {
  const comments = opts.comments || 'html';
  if (!['html', 'critic', 'drop'].includes(comments)) throw new Error(`unknown comments mode: ${comments}`);
  const body = resolveBody(bodyNode);
  const ctx = { comments, used: [], emitted: new Set(), threads: new Map() };
  for (const n of walkAll(body)) {
    if (isEl(n, 'aside') && attrsOf(n)['data-thread'] && !ctx.threads.has(attrsOf(n)['data-thread'])) {
      ctx.threads.set(attrsOf(n)['data-thread'], n);
    }
  }
  let md = sequenceMd(kidsOf(body), ctx);
  if (comments === 'critic') {
    for (const [id, aside] of ctx.threads) {
      if (ctx.emitted.has(id)) continue;
      for (const p of kidsOf(aside).filter((c) => isEl(c, 'p'))) {
        const author = attrsOf(p)['data-author'];
        md += `${md ? '\n\n' : ''}{>>${author ? `${author}: ` : ''}${inlineMd(kidsOf(p), ctx)}<<}`;
      }
    }
  }
  return md ? md + '\n' : '';
}

function* walkAll(node) {
  yield node;
  for (const c of node.children || []) yield* walkAll(c);
}

// -------------------------------------------------------------- markdown → HTML

const RE_HEADING = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?[ \t]*#*[ \t]*$/;
const RE_HR = /^ {0,3}(?:(?:-[ \t]*){3,}|(?:\*[ \t]*){3,}|(?:_[ \t]*){3,})$/;
const RE_FENCE = /^ {0,3}(`{3,}|~{3,})[ \t]*(.*)$/;
const RE_QUOTE = /^ {0,3}> ?(.*)$/;
const RE_ITEM = /^( *)([-+*]|\d{1,9}[.)])( +|$)(.*)$/;
const RE_ALERT = /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/i;
const RE_TAG = /^<(\/?)([a-zA-Z][\w-]*)((?:"[^"]*"|'[^']*'|[^>"'])*)>/;
const RE_ESCAPABLE = /[!-\/:-@\[-`{-~]/;

const indentOf = (l) => /^ */.exec(l)[0].length;
const warn = (ctx, message) => { ctx.warnings.push(message); };

function itemAt(line) {
  const m = RE_ITEM.exec(line);
  if (!m) return null;
  const spaces = m[3].length;
  const short = spaces >= 5; // 5+ spaces means "content starts after one space"
  return {
    indent: m[1].length,
    marker: m[2],
    ordered: /\d/.test(m[2][0]),
    contentIndent: m[1].length + m[2].length + (short ? 1 : Math.max(1, spaces)),
    rest: (short ? m[3].slice(1) : '') + m[4],
  };
}

function rawBlockTag(line) {
  if (/^ {0,3}<!--/.test(line)) return '!--';
  const m = /^ {0,3}<([a-zA-Z][\w-]*)(?:[\s/>]|$)/.exec(line);
  if (!m) return null;
  const tag = m[1].toLowerCase();
  return BLOCK.has(tag) ? tag : null;
}

function isBlockStart(line) {
  return RE_HEADING.test(line) || RE_FENCE.test(line) || RE_HR.test(line) || RE_QUOTE.test(line)
    || RE_ITEM.test(line) || rawBlockTag(line) !== null || /^ {4}/.test(line);
}

/** Net open-element depth of one line of a raw HTML block (we emit one tag per line). */
function depthOf(line) {
  let d = 0;
  const re = /<(\/?)([a-zA-Z][\w-]*)((?:"[^"]*"|'[^']*'|[^>])*)>/g;
  let m;
  while ((m = re.exec(line))) {
    if (m[3].endsWith('/')) continue;
    if (m[1] === '/') d--;
    else if (!VOID.has(m[2].toLowerCase())) d++;
  }
  return d;
}

function readRawLines(lines, i, tag, ctx) {
  const start = i;
  if (tag === '!--') {
    while (i < lines.length && !lines[i].includes('-->')) i++;
    if (i < lines.length) i++;
    else warn(ctx, 'unterminated HTML comment');
    return { html: lines.slice(start, i).join('\n'), i };
  }
  if (tag === 'pre') {
    while (i < lines.length && !/<\/pre>/i.test(lines[i])) i++;
    if (i < lines.length) i++;
    else warn(ctx, 'unterminated <pre> block');
    return { html: lines.slice(start, i).join('\n'), i };
  }
  let depth = 0;
  let raw = false; // inside a nested `<pre>`: its content is not markup
  do {
    const line = lines[i];
    if (raw) {
      if (/<\/pre>/i.test(line)) { raw = false; depth--; }
    } else {
      const at = line.search(/<pre[\s>]/i);
      if (at === -1) depth += depthOf(line);
      else {
        depth += depthOf(line.slice(0, at)) + 1;
        if (/<\/pre>/i.test(line.slice(at))) depth--;
        else raw = true;
      }
    }
    i++;
  } while (i < lines.length && (depth > 0 || raw));
  if (depth > 0 || raw) warn(ctx, `unterminated <${tag}> block`);
  return { html: lines.slice(start, i).join('\n'), i };
}

function readFence(lines, i, m, ctx) {
  const char = m[1][0];
  const len = m[1].length;
  const info = m[2].trim();
  const body = [];
  i++;
  let closed = false;
  while (i < lines.length) {
    const cm = /^ {0,3}(`{3,}|~{3,})\s*$/.exec(lines[i]);
    if (cm && cm[1][0] === char && cm[1].length >= len) { i++; closed = true; break; }
    body.push(lines[i]);
    i++;
  }
  if (!closed) warn(ctx, 'unterminated fenced code block');
  const lang = info.split(/[\s{]/)[0];
  const attr = lang ? ` data-lang="${escapeAttr(lang)}"` : '';
  return { html: `<pre${attr}>${escapeText(body.join('\n'))}</pre>`, i };
}

function readIndentedCode(lines, i) {
  const body = [];
  let pending = 0;
  while (i < lines.length) {
    if (!lines[i].trim()) { pending++; i++; continue; }
    if (!/^ {4}/.test(lines[i])) break;
    while (pending) { body.push(''); pending--; }
    body.push(lines[i].slice(4));
    i++;
  }
  return { html: `<pre>${escapeText(body.join('\n'))}</pre>`, i };
}

function readQuote(lines, i, ctx) {
  const inner = [];
  while (i < lines.length) {
    const m = RE_QUOTE.exec(lines[i]);
    if (m) { inner.push(m[1]); i++; continue; }
    if (lines[i].trim() && !isBlockStart(lines[i])) { inner.push(lines[i].trim()); i++; continue; }
    break;
  }
  const alert = RE_ALERT.exec(inner[0] || '');
  if (alert) {
    const note = ALERT_TO_NOTE[alert[1].toUpperCase()];
    const body = parseBlocks(inner.slice(1), ctx);
    return { html: body ? `<aside data-note="${note}">\n${body}\n</aside>` : `<aside data-note="${note}"></aside>`, i };
  }
  const body = parseBlocks(inner, ctx);
  return { html: body ? `<blockquote>\n${body}\n</blockquote>` : '<blockquote></blockquote>', i };
}

function readList(lines, i, ctx) {
  const first = itemAt(lines[i]);
  const ordered = first.ordered;
  const start = parseInt(first.marker, 10);
  const items = [];
  while (i < lines.length) {
    const m = itemAt(lines[i]);
    if (!m || m.ordered !== ordered) break;
    let rest = m.rest;
    let contentIndent = m.contentIndent;
    let checked;
    const box = /^\[([ xX])\](?: |$)/.exec(rest);
    if (box) { checked = box[1] !== ' '; rest = rest.slice(box[0].length); contentIndent += box[0].length; }
    const body = [rest];
    i++;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) {
        let j = i;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && indentOf(lines[j]) >= contentIndent) {
          while (i < j) { body.push(''); i++; }
          continue;
        }
        i = j;
        break;
      }
      if (indentOf(l) >= contentIndent) { body.push(l.slice(contentIndent)); i++; continue; }
      if (!isBlockStart(l)) { body.push(l.trim()); i++; continue; } // lazy continuation
      break;
    }
    items.push({ body, checked });
  }
  const tag = ordered ? 'ol' : 'ul';
  const attr = ordered && start !== 1 ? ` start="${start}"` : '';
  const html = items.map(({ body, checked }) => {
    const inner = parseBlocks(body, ctx);
    // A leading `<p>` in an item is written as bare text (that is how the
    // canonical form of `<li>a<ul>…` looks); later blocks stay as blocks.
    const lead = /^<p>((?:(?!<\/p>)[\s\S])*)<\/p>/.exec(inner);
    const head = lead ? lead[1] : '';
    const rest = lead ? inner.slice(lead[0].length) : inner;
    const liAttr = checked === undefined ? '' : ` data-checked="${checked ? 'true' : 'false'}"`;
    if (lead) return `<li${liAttr}>${head}${rest}</li>`;
    return `<li${liAttr}>\n${inner}\n</li>`;
  });
  return { html: `<${tag}${attr}>\n${html.join('\n')}\n</${tag}>`, i };
}

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (/(^|[^\\])\|$/.test(s)) s = s.slice(0, -1);
  return s.split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, '|').trim());
}

function delimAligns(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  const cells = s.split('|').map((c) => c.trim());
  if (!cells.length || !cells.every((c) => /^:?-+:?$/.test(c))) return null;
  return cells.map((c) => (c.startsWith(':') && c.endsWith(':') ? 'center'
    : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : null));
}

function readTable(lines, i, aligns, ctx) {
  const head = splitRow(lines[i]);
  i += 2;
  const rows = [];
  while (i < lines.length && lines[i].trim() && lines[i].includes('|')) { rows.push(splitRow(lines[i])); i++; }
  const pend = [];
  const row = (cells, tag) => `<tr>${cells.map((c, k) => {
    const a = aligns[k] || null;
    return `<${tag}${a ? ` data-align="${a}"` : ''}>${inline(c, ctx, pend)}</${tag}>`;
  }).join('')}</tr>`;
  const body = rows.length ? `<tbody>\n${rows.map((r) => row(r, 'td')).join('\n')}\n</tbody>\n` : '';
  return { html: finish(ctx, pend, `<table>\n<thead>\n${row(head, 'th')}\n</thead>\n${body}</table>`), i };
}

function readParagraph(lines, i, ctx) {
  const buf = [lines[i]];
  i++;
  while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
  let text = buf.join('\n');
  // A `<br>` at the very end of a paragraph prints as two trailing spaces with no
  // newline after them to detect it, so check the block's tail as well.
  const tail = / {2,}$/.exec(text);
  if (tail) text = text.slice(0, -tail[0].length) + '<br>';
  const img = imageOnly(text);
  if (img) {
    let j = i;
    while (j < lines.length && !lines[j].trim()) j++;
    const cap = /^\*([^*]+)\*$/.exec((lines[j] || '').trim());
    if (cap && (j + 1 >= lines.length || !lines[j + 1].trim())) {
      return { html: `<figure>\n${inlineBlock(text, ctx)}\n<figcaption>${inlineBlock(cap[1], ctx)}</figcaption>\n</figure>`, i: j + 1 };
    }
  }
  const html = inlineBlock(text, ctx);
  // A paragraph that was nothing but `{>>…<<}` is comment, not text: the aside
  // takes its place instead of being tucked inside an empty `<p>`.
  const cut = html.indexOf('\n<aside data-thread="');
  if (cut === 0) return { html: html.slice(1), i };
  if (html === '') return { html, i };
  if (cut === -1) return { html: `<p>${html}</p>`, i };
  return { html: `<p>${html.slice(0, cut)}</p>\n${html.slice(cut + 1)}`, i };
}

/** Is this paragraph exactly one `![…](…)`? (The figure form.) */
function imageOnly(text) {
  const m = /^!\[((?:[^\]\\]|\\.)*)\]\(/.exec(text);
  if (!m) return false;
  const d = readDest(text, m[0].length - 1);
  return !!d && d.i === text.length;
}

function parseBlocks(lines, ctx) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if (/^ {4}/.test(line)) { const r = readIndentedCode(lines, i); out.push(r.html); i = r.i; continue; }
    if ((m = RE_FENCE.exec(line))) { const r = readFence(lines, i, m, ctx); out.push(r.html); i = r.i; continue; }
    if (RE_HR.test(line)) { out.push('<hr>'); i++; continue; }
    if ((m = RE_HEADING.exec(line))) { out.push(`<h${m[1].length}>${inlineBlock(m[2] || '', ctx)}</h${m[1].length}>`); i++; continue; }
    if (RE_QUOTE.test(line)) { const r = readQuote(lines, i, ctx); out.push(r.html); i = r.i; continue; }
    if (itemAt(line)) { const r = readList(lines, i, ctx); out.push(r.html); i = r.i; continue; }
    // GFM wants the delimiter row to have exactly the header's cell count.
    const aligns = lines[i + 1] !== undefined && line.includes('|') ? delimAligns(lines[i + 1]) : null;
    if (aligns && splitRow(line).length === aligns.length) { const r = readTable(lines, i, aligns, ctx); out.push(r.html); i = r.i; continue; }
    const tag = rawBlockTag(line);
    if (tag && tag !== '!--' && VOCAB.has(tag)) { const r = readRawLines(lines, i, tag, ctx); out.push(r.html); i = r.i; continue; }
    if (tag === '!--') { const r = readRawLines(lines, i, tag, ctx); out.push(r.html); i = r.i; continue; }
    const r = readParagraph(lines, i, ctx);
    out.push(r.html);
    i = r.i;
  }
  return out.join('\n');
}

// ------------------------------------------------------------------- inline

function readDest(src, i) {
  if (src[i] !== '(') return null;
  let j = i + 1;
  while (src[j] === ' ' || src[j] === '\n') j++;
  let url;
  if (src[j] === '<') {
    const end = src.indexOf('>', j + 1);
    if (end === -1) return null;
    url = src.slice(j + 1, end);
    j = end + 1;
  } else {
    let depth = 0;
    const start = j;
    while (j < src.length && (depth > 0 || (src[j] !== ')' && (depth > 0 || !/\s/.test(src[j]))))) {
      if (src[j] === '\\') j++;
      else if (src[j] === '(') depth++;
      else if (src[j] === ')') depth--;

  const img = h('img', { alt: file.name.replace(/\.[^.]+$/, ''), src });
  insertInline([img]);

  const body = prompt('Comment');
  if (!body) return;

    made = mutate((tree) => addComment(tree, {
      body: bodyNodeOf(tree), selector, quote, text: body, author: AUTHOR, at: now(),
    }));

    status(`comment failed: ${err.message}`);

  list.replaceChildren();

    li.append(h('b', {}, `${t.id} · ${t.author || 'unknown'}`));

  open: () => openFile(),
  save: () => save(),
  strong: () => toggleInline('strong'),
  em: () => toggleInline('em'),
  u: () => toggleInline('u'),
  s: () => toggleInline('s'),
  code: () => toggleInline('code'),
  mark: () => toggleInline('mark'),
  a: () => {
    const url = prompt('Link URL', 'https://');
    if (url) toggleInline('a', { href: url });
  },
  h1: () => blockCommand((b) => setBlockName(b, 'h1')),
  h2: () => blockCommand((b) => setBlockName(b, 'h2')),
  h3: () => blockCommand((b) => setBlockName(b, 'h3')),
  h4: () => blockCommand((b) => setBlockName(b, 'h4')),
  h5: () => blockCommand((b) => setBlockName(b, 'h5')),
  h6: () => blockCommand((b) => setBlockName(b, 'h6')),
  ul: () => blockCommand((b) => toggleList(b, 'ul')),
  ol: () => blockCommand((b) => toggleList(b, 'ol')),
  blockquote: () => blockCommand((b) => toggleBlockquote(b)),
  pre: () => blockCommand((b) => toPre(b)),
  hr: () => { insertHrHere(); edited(); },
  img: () => $('#image-input').click(),
  comment: () => commentOnSelection(),
  suggest: () => toggleSuggest(),
  accept: () => changeCommand(acceptChanges, 'accepted'),
  reject: () => changeCommand(rejectChanges, 'rejected'),
  'copy-cli': () => {
    const cmd = $('#st-cli').textContent;
    const pending = navigator.clipboard && navigator.clipboard.writeText(cmd);
    if (pending && pending.then) {
      pending.then(() => status('CLI command copied'),
        () => { selectContents($('#st-cli')); status('clipboard blocked — the command is selected, copy it manually'); });
    } else {

async function openFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{
          description: 'Neodoc document',
          accept: { 'text/html': ['.nd.html', '.ndoc.html', '.ndoc', '.html', '.htm'] },
        }],

      const file = await handle.getFile();

      if (err && err.name === 'AbortError') return;

// ---------------------------------------------------------------------- status

  const { root } = liveTree();

  const sel = caretRange();
  const block = sel ? blockOf(sel.startContainer) : null;
  const path = block ? liveSelector(block) : 'body';
  $('#st-sel').textContent = path;
  $('#st-cli').textContent = `neodoc get ${state.name} '${path}'`;
  const threads = renderThreads();
  $('#st-comments').textContent = `${threads.filter((t) => t.state !== 'resolved').length} comments`;
  $('#st-dirty').textContent = state.dirty ? 'unsaved' : 'saved';
  $('#st-dirty').dataset.dirty = String(state.dirty);
}

// ------------------------------------------------------------------------ wire

// Buttons must not steal the selection from the document.
$('#chrome').addEventListener('mousedown', (e) => {
  if (e.target.closest('button')) e.preventDefault();
});
$('#chrome').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-cmd]');
  if (btn) { const fn = COMMANDS[btn.dataset.cmd]; if (fn) fn(); return; }
  const threadBtn = e.target.closest('#threads button');
  if (threadBtn) {
    threadAction(threadBtn.closest('li').dataset.id, /Resolve/.test(threadBtn.getAttribute('aria-label')) ? 'resolve' : 'reply');
  }
});
$('#embed').addEventListener('change', (e) => { state.embed = e.target.checked; });
$('#open-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) await openText(file.name, await file.text());
  e.target.value = '';
});
$('#image-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) await insertImage(file);
  e.target.value = '';
});

document.addEventListener('input', (e) => {
  if (e.target === document.body || document.body.contains(e.target)) onInput(e);
});
document.addEventListener('beforeinput', onBeforeInput);
document.addEventListener('paste', onPaste);
document.addEventListener('selectionchange', () => {
  if (!document.body.contains(document.getSelection()?.anchorNode ?? document.body)) return;
  refresh();
});
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) {
    if (e.key === 'Tab') return onTab(e);
    if (e.key === 'Enter') return e.shiftKey ? onShiftEnter(e) : onEnter(e);
    if (e.key === 'Backspace') return onBackspace(e);
    return;
  }
  const code = e.code;
  const key = e.key.toLowerCase();
  if (key === 'z' || key === 'y') {
    // A comment box (inside the chrome) keeps the browser's own undo, which is the
    // right one for a text field; the document's history is ours.
    if (CHROME.contains(document.getSelection() && document.getSelection().anchorNode)) return;
    e.preventDefault();
    if (key === 'z' && !e.shiftKey) undo();
    else status('redo is not available — the editor keeps undo only');
    return;
  }
  if (e.altKey) {
    if (/^Digit[1-6]$/.test(code)) { e.preventDefault(); return COMMANDS[`h${code.slice(5)}`](); }
    if (code === 'KeyM') { e.preventDefault(); return commentOnSelection(); }
    return;
  }
  if (e.shiftKey) {
    if (code === 'Digit7') { e.preventDefault(); return COMMANDS.ol(); }
    if (code === 'Digit8') { e.preventDefault(); return COMMANDS.ul(); }
    return;
  }
  switch (e.key.toLowerCase()) {
    case 's': e.preventDefault(); return save();
    case 'b': e.preventDefault(); return COMMANDS.strong();
    case 'i': e.preventDefault(); return COMMANDS.em();
    case 'u': e.preventDefault(); return COMMANDS.u();
    case 'k': e.preventDefault(); return COMMANDS.a();
    default: return;
  }
});
document.addEventListener('dragover', (e) => {
  const types = e.dataTransfer ? [...e.dataTransfer.types] : [];
  if (types.includes('Files') || types.includes('text/html') || types.includes('text/plain')) e.preventDefault();
});
document.addEventListener('drop', async (e) => {
  const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
  if (!files.length) {
    // A dropped fragment is pasted content, so it goes through the paste
    // sanitizer: the browser would otherwise insert its markup verbatim.
    const html = e.dataTransfer?.getData('text/html');
    const plain = e.dataTransfer?.getData('text/plain');
    if (!html && !plain) return;
    e.preventDefault();
    snapshot(); // a dropped fragment is an edit like any other
    if (html) return insertNodes(sanitizedNodes(html));
    return insertInline(plain.split('\n').flatMap((line, i) => (i ? [h('br'), text(line)] : [text(line)])));
  }
  e.preventDefault();
  const image = files.find((f) => f.type.startsWith('image/'));
  if (image) return insertImage(image);
  const doc = files.find((f) => DOC_NAME.test(f.name));
  if (doc) await openText(doc.name, await doc.text());
});

// ------------------------------------------------------------------------ boot

sweepEditorNodes();
if ((await loadServed()) === false) {
  status('no file open — Open a .nd.html (or drop one in); Save writes through the browser file handle when available, else downloads it');
}
if (!blocksInBody().length) document.body.prepend(h('p'));
refresh();
// A document's links are content, but an executable scheme navigates or runs in
// this page rather than opening somewhere else.
document.addEventListener('click', (e) => {
  const hit = e.target instanceof Element ? e.target.closest('a[href]') : null;
  if (hit && executableUrl(hit.getAttribute('href') || '')) {
    e.preventDefault();
    status('refused a link with an executable URL');
  }
});
window.addEventListener('beforeunload', (e) => {
  if (state.dirty) e.preventDefault();
});

// Exposed for the CLI/e2e driver: no behaviour depends on it.
window.neodocEditor = { canonicalText, save, openText, applyDocument, state, liveSelector };

__mods["editor/editor"] = {};
})();
</script>
</body>
</html>
